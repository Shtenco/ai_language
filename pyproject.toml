[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-language-pro"
version = "0.4.0"
description = "AI Language Pro: semantic compiler plus a local repository-aware AI coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Shtenco" }
]
keywords = ["ai", "agent", "coding-agent", "cli", "llm", "openai", "compiler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "openai>=1.66.0",
  "python-dotenv>=1.0.1"
]

[project.urls]
Homepage = "https://github.com/Shtenco/ai_language"
Repository = "https://github.com/Shtenco/ai_language"
Issues = "https://github.com/Shtenco/ai_language/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.0"
]

[project.scripts]
ai-language = "ai_language.cli:main"
ail = "ai_language.cli:agent_main"
ai-language-agent = "ai_language.cli:agent_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
