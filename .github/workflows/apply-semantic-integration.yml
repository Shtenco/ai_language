name: Apply semantic integration patch

on:
  push:
    paths:
      - '.github/workflows/apply-semantic-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feature/repository-impact-graph'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/repository-impact-graph

      - name: Apply targeted patch
        run: python scripts/patch_agent_root.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/patch_agent_root.py
          rm .github/workflows/apply-semantic-integration.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate workspace root into repository graph"
          git push origin HEAD:feature/repository-impact-graph
