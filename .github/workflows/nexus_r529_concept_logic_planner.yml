name: NEXUS R5.29 Concept Logic Planner
on:
  push:
    branches: ["nexus-r529-concept-logic-planner"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 50k concept/causal plans
        run: python benchmarks/r529_concept_logic_planner.py --n 50000 --out nexus_r529_results
      - name: Evidence
        run: |
          cat nexus_r529_results/00_R529_RESULTS.json
          sed -n '1,220p' nexus_r529_results/01_PLANS.json
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R529_CONCEPT_LOGIC_PLANNER
          path: nexus_r529_results/
          retention-days: 30
