name: NEXUS R5.10 Recovery Micro
on:
  push:
    branches: ["nexus-r510-recovery-micro"]
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Data
        run: |
          mkdir -p data/r510m
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r510m/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r510m/b.conllu
          cat data/r510m/a.conllu data/r510m/b.conllu > data/r510m/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r510m/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r510m/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r510m/synt.conllu','data/r510m/synt.txt'),('data/r510m/gsd.conllu','data/r510m/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r510m/train.conllu --out data/r510m/rich
      - name: Train recovery micro
        run: |
          python benchmarks/r510_rollout_recovery.py \
            --train-text data/r510m/rich/ru_train.txt \
            --train-docs data/r510m/rich/ru_train_docs.jsonl \
            --memory-docs data/r510m/rich/graph_memory_docs.jsonl \
            --tests data/r510m/synt.txt data/r510m/gsd.txt data/r510m/rich/ru_heritage_test.txt \
            --out nexus_r510_micro_results --steps 256 --batch 8 --seed 20260810 --threads 2
          cp data/r510m/rich/CORPUS_META.json nexus_r510_micro_results/
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r510_micro_results/00_R510_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r510_micro_results/00_R510_RESULTS.json',encoding='utf-8'))
          print(r['training']);print({k:round(v['bpb'],6) for k,v in r['eval'].items()});print('logic/cyber',r['logic_generation']['accuracy'],r['cyber_generation']['accuracy'])
          PY
          fi
          if [ -f nexus_r510_micro_results/01_RAW_GENERATIONS.txt ]; then cat nexus_r510_micro_results/01_RAW_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r510_micro_results ]; then tar -czf NEXUS_R510_RECOVERY_MICRO.tar.gz nexus_r510_micro_results; sha256sum NEXUS_R510_RECOVERY_MICRO.tar.gz > NEXUS_R510_RECOVERY_MICRO_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R510_RECOVERY_MICRO
          path: |
            nexus_r510_micro_results/
            NEXUS_R510_RECOVERY_MICRO.tar.gz
            NEXUS_R510_RECOVERY_MICRO_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
