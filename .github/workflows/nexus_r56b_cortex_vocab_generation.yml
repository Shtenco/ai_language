name: NEXUS R5.6b Cortex Vocab Generation
on:
  push:
    branches: ["nexus-r56b-cortex-vocab-generation"]
  workflow_dispatch:
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        vocab: [4096, 8192]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          python -m pip install sentencepiece
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Download exact R5.6 training bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r56_source
          gh run download 31326022088 --repo Shtenco/ai_language -n NEXUS_R56_3M_RUSSIAN_ADEQUACY -D r56_source
          sha256sum r56_source/nexus_r56_results/_sp_train.txt
          test "$(sha256sum r56_source/nexus_r56_results/_sp_train.txt | cut -d' ' -f1)" = "d386c0557c717984dca26d5e5e52005c887f781063ae7e81f6f96968f8cc2afd"
      - name: Download fixed Russian heldout corpora
        run: |
          mkdir -p data/r56b
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r56b/ru_synt.test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r56b/ru_gsd.test.conllu
      - name: Train and test 3M vocab ${{ matrix.vocab }}
        run: |
          python benchmarks/r56b_cortex_vocab_generation.py \
            --train r56_source/nexus_r56_results/_sp_train.txt \
            --synt-test data/r56b/ru_synt.test.conllu \
            --gsd-test data/r56b/ru_gsd.test.conllu \
            --vocab ${{ matrix.vocab }} \
            --out nexus_r56b_${{ matrix.vocab }} --threads 2
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R56B_3M_UNIGRAM${{ matrix.vocab }}
          path: nexus_r56b_${{ matrix.vocab }}/
          retention-days: 30
