name: NEXUS R5.26 11M Diverse Clean
on:
  push:
    branches: ["nexus-r526-11m-diverse-clean"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Restore fixed tokenizer
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R512_DEEP_LANGUAGE
          path: warmtok
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31336592447
      - name: Restore 11M capacity pilot checkpoint
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R524P_11M
          path: warm11
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31356077664
      - name: Download fixed Russian UD tests/train source
        run: |
          mkdir -p data/r526
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r526/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r526/b.conllu
          cat data/r526/a.conllu data/r526/b.conllu > data/r526/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r526/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r526/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r526/synt.conllu','data/r526/synt.txt'),('data/r526/gsd.conllu','data/r526/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Build document-disjoint diverse Russian corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_russian_corpus.py \
            --synt-train data/r526/train.conllu --out data/r526/rich \
            --wiki-train-mb 20 --wiki-memory-mb 5 --wiki-test-mb 3 \
            --heritage-train-mb 6 --heritage-test-mb 2 --synt-train-mb 4 --max-doc-kb 24
          cat data/r526/rich/CORPUS_META.json
      - name: Continue clean 11M cortex for 8192 steps
        run: |
          python -m py_compile benchmarks/r526_11m_diverse_clean.py
          python benchmarks/r526_11m_diverse_clean.py \
            --checkpoint warm11/R524_11M.pt \
            --tokenizer-model warmtok/nexus_r512_results/sp_unigram_4096.model \
            --train-docs data/r526/rich/ru_train_docs.jsonl \
            --tests data/r526/synt.txt data/r526/gsd.txt data/r526/rich/ru_wiki_test.txt data/r526/rich/ru_heritage_test.txt \
            --out nexus_r526_results --steps 8192 --batch 8 --threads 2 --lr 0.00025
      - name: Evidence
        if: always()
        run: |
          cp data/r526/rich/CORPUS_META.json nexus_r526_results/ 2>/dev/null || true
          if [ -f nexus_r526_results/00_R526_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r526_results/00_R526_RESULTS.json',encoding='utf-8'));print(r['protocol']);print(r['training'])
          for s,v in r['eval'].items():print(s,{k:round(x['bpb'],6) for k,x in v.items()})
          PY
          fi
          cat nexus_r526_results/01_RAW_GENERATIONS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R526_11M_DIVERSE_CLEAN
          path: nexus_r526_results/
          retention-days: 30
