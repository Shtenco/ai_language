name: NEXUS R5.24 Graph-Grounded Answer Loop
on:
  push:
    branches: ["nexus-r524-graph-grounded-answer-loop"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 50k graph-grounded plans
        run: python benchmarks/r524_graph_grounded_answer_loop.py --n 50000 --out nexus_r524_results
      - name: Evidence
        run: |
          cat nexus_r524_results/README_RU.md
          cat nexus_r524_results/00_R524_RESULTS.json
          sed -n '1,30p' nexus_r524_results/01_EXAMPLES.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R524_GRAPH_GROUNDED_LOOP
          path: nexus_r524_results/
          retention-days: 30
