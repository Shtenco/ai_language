name: NEXUS R5.11 Pointer Recovery
on:
  push:
    branches: ["nexus-r511-pointer-recovery"]
  workflow_dispatch:

jobs:
  pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Data
        run: |
          mkdir -p data/r511
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r511/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r511/b.conllu
          cat data/r511/a.conllu data/r511/b.conllu > data/r511/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r511/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r511/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r511/synt.conllu','data/r511/synt.txt'),('data/r511/gsd.conllu','data/r511/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r511/train.conllu --out data/r511/rich
      - name: Train 1024-step pointer+recovery
        run: |
          set +e
          python benchmarks/r511_pointer_recovery.py \
            --train-text data/r511/rich/ru_train.txt \
            --train-docs data/r511/rich/ru_train_docs.jsonl \
            --memory-docs data/r511/rich/graph_memory_docs.jsonl \
            --tests data/r511/synt.txt data/r511/gsd.txt data/r511/rich/ru_heritage_test.txt \
            --out nexus_r511_results --steps 1024 --batch 8 --seed 20260810 --threads 2
          rc=$?
          cp data/r511/rich/CORPUS_META.json nexus_r511_results/ 2>/dev/null || true
          cp benchmarks/r511_pointer_recovery.py nexus_r511_results/R511_SOURCE.py 2>/dev/null || true
          echo $rc > nexus_r511_results/TRAIN_EXIT_CODE.txt
          exit $rc
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r511_results/00_R511_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r511_results/00_R511_RESULTS.json',encoding='utf-8'))
          print(r['training']);print({k:round(v['bpb'],6) for k,v in r['eval'].items()});print('logic/cyber',r['logic_generation']['accuracy'],r['cyber_generation']['accuracy'])
          PY
          fi
          if [ -f nexus_r511_results/01_RAW_GENERATIONS.txt ]; then cat nexus_r511_results/01_RAW_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r511_results ]; then tar -czf NEXUS_R511_POINTER_RECOVERY.tar.gz nexus_r511_results; sha256sum NEXUS_R511_POINTER_RECOVERY.tar.gz > NEXUS_R511_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R511_POINTER_RECOVERY
          path: |
            nexus_r511_results/
            NEXUS_R511_POINTER_RECOVERY.tar.gz
            NEXUS_R511_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
