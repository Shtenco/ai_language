name: Create AI Language Pro 0.5.0 release

on:
  push:
    paths:
      - '.github/workflows/release-v050-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "799b21945fc2d380a0fd56800d96d288e45f1eb9" \
            --title "AI Language Pro 0.5.0" \
            --notes "AI Language Pro 0.5.0 connects the coding-agent runtime to semantic requirement and repository graphs. It adds bounded Python AST indexing for files, classes, functions, methods, tests, imports and calls; requirement-to-action provenance; ChangeGraph and ImpactGraph; requirement coverage with unresolved detection; semantic-trace/v2 JSON export; /coverage; --trace-out; --show-coverage; and --fail-unresolved. Ruff and pytest pass in branch and PR CI."
