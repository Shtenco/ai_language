name: NEXUS R5 Real LM 1M

on:
  push:
    branches: ["nexus-r5-real-lm-1m"]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch CPU
        run: |
          python -m pip install --upgrade pip
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch
          print(torch.__version__)
          PY
      - name: Download real corpora
        run: |
          mkdir -p data/real_lm
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt -o data/real_lm/wiki.train.txt
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/valid.txt -o data/real_lm/wiki.valid.txt
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/test.txt -o data/real_lm/wiki.test.txt
          curl -fL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o data/real_lm/tinyshakespeare.txt
          wc -c data/real_lm/*
          sha256sum data/real_lm/* > data/real_lm/CORPUS_SHA256SUMS.txt
      - name: Run matched benchmark
        run: |
          python benchmarks/r5_real_lm_1m.py \
            --train data/real_lm/wiki.train.txt \
            --valid data/real_lm/wiki.valid.txt \
            --test data/real_lm/wiki.test.txt \
            --shift data/real_lm/tinyshakespeare.txt \
            --out nexus_r5_real_lm_results \
            --seeds 11,29,47 --threads 2
          cp data/real_lm/CORPUS_SHA256SUMS.txt nexus_r5_real_lm_results/
      - name: Archive results
        run: |
          tar -czf NEXUS_R5_REAL_LM_1M_RESULTS.tar.gz nexus_r5_real_lm_results
          sha256sum NEXUS_R5_REAL_LM_1M_RESULTS.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R5_REAL_LM_1M_RESULTS
          path: |
            nexus_r5_real_lm_results/
            NEXUS_R5_REAL_LM_1M_RESULTS.tar.gz
          retention-days: 30
