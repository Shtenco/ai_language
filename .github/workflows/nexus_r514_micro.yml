name: NEXUS R5.14 Planner Micro
on:
  push:
    branches: ["nexus-r514-micro"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Restore R5.12 32K
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R512_DEEP_LANGUAGE
          path: warm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31336592447
      - name: Data
        run: |
          mkdir -p data/r514m
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r514m/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r514m/b.conllu
          cat data/r514m/a.conllu data/r514m/b.conllu > data/r514m/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r514m/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r514m/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r514m/synt.conllu','data/r514m/synt.txt'),('data/r514m/gsd.conllu','data/r514m/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r514m/train.conllu --out data/r514m/rich
      - name: Train 256-step planner micro
        run: |
          python benchmarks/r514_hierarchical_planner.py \
            --checkpoint warm/nexus_r512_results/R512_DEEP_LANGUAGE_3M.pt \
            --tokenizer-model warm/nexus_r512_results/sp_unigram_4096.model \
            --train-docs data/r514m/rich/ru_train_docs.jsonl \
            --memory-docs data/r514m/rich/graph_memory_docs.jsonl \
            --tests data/r514m/synt.txt data/r514m/gsd.txt data/r514m/rich/ru_heritage_test.txt \
            --out nexus_r514_micro --steps 256 --batch 8 --threads 2 --lr 0.0002
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r514_micro/00_R514_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r514_micro/00_R514_RESULTS.json',encoding='utf-8'))
          print('protocol',r['protocol'])
          for split,v in r['eval'].items():print(split,{m:round(x['bpb'],6) for m,x in v.items()},'recall',round(v['true']['plan_recall_at8'],4))
          PY
          fi
          cat nexus_r514_micro/01_RAW_GENERATIONS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R514_PLANNER_MICRO
          path: nexus_r514_micro/
          retention-days: 30
