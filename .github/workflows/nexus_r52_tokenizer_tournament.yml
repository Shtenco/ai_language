name: NEXUS R5.2 Tokenizer Tournament
on:
  push:
    branches: ["nexus-r52-tokenizer-deathmatch"]
  workflow_dispatch:
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install SentencePiece
        run: python -m pip install sentencepiece
      - name: Download real corpora
        run: |
          mkdir -p data/r52
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt -o data/r52/wiki.train.txt
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/test.txt -o data/r52/wiki.test.txt
          curl -fL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o data/r52/tinyshakespeare.txt
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r52/ru_synt.train.a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r52/ru_synt.train.b.conllu
          cat data/r52/ru_synt.train.a.conllu data/r52/ru_synt.train.b.conllu > data/r52/ru_synt.train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r52/ru_synt.test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r52/ru_gsd.test.conllu
          sha256sum data/r52/* > data/r52/CORPUS_SHA256SUMS.txt
      - name: Prepare balanced EN-RU train
        run: |
          python benchmarks/prepare_r52_corpora.py \
            --wiki-train data/r52/wiki.train.txt \
            --synt-train data/r52/ru_synt.train.conllu \
            --synt-test data/r52/ru_synt.test.conllu \
            --gsd-test data/r52/ru_gsd.test.conllu \
            --out data/r52/prepared --per-lang-bytes 5000000
      - name: Run tournament
        run: |
          python benchmarks/r52_tokenizer_tournament.py \
            --train data/r52/prepared/mixed_train.txt \
            --tests data/r52/wiki.test.txt data/r52/tinyshakespeare.txt data/r52/prepared/ru_synt_test.txt data/r52/prepared/ru_gsd_shift.txt \
            --out nexus_r52_tokenizer_results
          cp data/r52/CORPUS_SHA256SUMS.txt nexus_r52_tokenizer_results/
      - name: Archive
        run: |
          tar -czf NEXUS_R52_TOKENIZER_TOURNAMENT.tar.gz nexus_r52_tokenizer_results
          sha256sum NEXUS_R52_TOKENIZER_TOURNAMENT.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R52_TOKENIZER_TOURNAMENT
          path: |
            nexus_r52_tokenizer_results/
            NEXUS_R52_TOKENIZER_TOURNAMENT.tar.gz
          retention-days: 30
