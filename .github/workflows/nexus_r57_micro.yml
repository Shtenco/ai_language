name: NEXUS R5.7 Micro A-vs-D
on:
  push:
    branches: ["nexus-r57-micro"]
  workflow_dispatch:

jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print('torch',torch.__version__)
          PY
      - name: Download UD
        run: |
          mkdir -p data/r57micro
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r57micro/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r57micro/b.conllu
          cat data/r57micro/a.conllu data/r57micro/b.conllu > data/r57micro/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r57micro/synt.test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r57micro/gsd.test.conllu
      - name: Extract tests
        run: |
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r57micro/synt.test.conllu','data/r57micro/synt.txt'),('data/r57micro/gsd.test.conllu','data/r57micro/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Build corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r57micro/train.conllu --out data/r57micro/rich
      - name: Run micro falsification
        run: |
          python benchmarks/r57_micro.py \
            --train-text data/r57micro/rich/ru_train.txt \
            --train-docs data/r57micro/rich/ru_train_docs.jsonl \
            --memory-docs data/r57micro/rich/graph_memory_docs.jsonl \
            --tests data/r57micro/synt.txt data/r57micro/gsd.txt data/r57micro/rich/ru_heritage_test.txt \
            --out nexus_r57_micro_results \
            --screen-seeds 11 \
            --threads 2
          cp data/r57micro/rich/CORPUS_META.json nexus_r57_micro_results/
      - name: Raw samples
        if: always()
        run: |
          if [ -f nexus_r57_micro_results/03_RAW_RUSSIAN_GENERATIONS.txt ]; then cat nexus_r57_micro_results/03_RAW_RUSSIAN_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r57_micro_results ]; then
            tar -czf NEXUS_R57_MICRO.tar.gz nexus_r57_micro_results
            sha256sum NEXUS_R57_MICRO.tar.gz > NEXUS_R57_MICRO_SHA256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R57_MICRO
          path: |
            nexus_r57_micro_results/
            NEXUS_R57_MICRO.tar.gz
            NEXUS_R57_MICRO_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
