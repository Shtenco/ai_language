name: NEXUS R5.6 3M Russian Adequacy
on:
  push:
    branches: ["nexus-r56-3m-russian-adequacy"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print('torch',torch.__version__)
          PY
      - name: Download fixed evaluation corpora
        run: |
          mkdir -p data/r56
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt -o data/r56/wiki.train.txt
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/test.txt -o data/r56/wiki.test.txt
          curl -fL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o data/r56/tinyshakespeare.txt
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r56/ru_synt.train.a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r56/ru_synt.train.b.conllu
          cat data/r56/ru_synt.train.a.conllu data/r56/ru_synt.train.b.conllu > data/r56/ru_synt.train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r56/ru_synt.test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r56/ru_gsd.test.conllu
          sha256sum data/r56/* > data/r56/FIXED_CORPUS_SHA256SUMS.txt
      - name: Prepare UD heldout text
        run: |
          python benchmarks/prepare_r52_corpora.py \
            --wiki-train data/r56/wiki.train.txt \
            --synt-train data/r56/ru_synt.train.conllu \
            --synt-test data/r56/ru_synt.test.conllu \
            --gsd-test data/r56/ru_gsd.test.conllu \
            --out data/r56/udprepared --per-lang-bytes 4000000
      - name: Prepare stable Russian pretraining corpus
        run: |
          python benchmarks/prepare_r56_russian_corpus.py \
            --synt-train data/r56/ru_synt.train.conllu \
            --out data/r56/rich \
            --heritage-train-mb 12 --synt-train-mb 6 --heldout-mb 2
          cat data/r56/rich/CORPUS_META.json
      - name: Run 3M sweep and Russian generation test
        run: |
          TESTS=(data/r56/udprepared/ru_synt_test.txt data/r56/udprepared/ru_gsd_shift.txt data/r56/wiki.test.txt data/r56/tinyshakespeare.txt)
          if [ -s data/r56/rich/ru_heritage_test.txt ]; then TESTS+=(data/r56/rich/ru_heritage_test.txt); fi
          python benchmarks/r56_3m_russian_adequacy.py \
            --train data/r56/rich/ru_train.txt \
            --tests "${TESTS[@]}" \
            --out nexus_r56_results --seeds 11,29,47 --threads 2
          cp data/r56/rich/CORPUS_META.json nexus_r56_results/
          cp data/r56/FIXED_CORPUS_SHA256SUMS.txt nexus_r56_results/
      - name: Archive
        run: |
          tar -czf NEXUS_R56_3M_RUSSIAN_ADEQUACY.tar.gz nexus_r56_results
          sha256sum NEXUS_R56_3M_RUSSIAN_ADEQUACY.tar.gz | tee NEXUS_R56_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R56_3M_RUSSIAN_ADEQUACY
          path: |
            nexus_r56_results/
            NEXUS_R56_3M_RUSSIAN_ADEQUACY.tar.gz
            NEXUS_R56_SHA256.txt
          retention-days: 30
