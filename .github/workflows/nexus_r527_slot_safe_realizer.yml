name: NEXUS R5.27 Slot-Safe Neural Realizer
on:
  push:
    branches: ["nexus-r527-slot-safe-neural-realizer"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Warm R5.12
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R512_DEEP_LANGUAGE
          path: warm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31336592447
      - name: Train plan-to-surface realizer
        run: |
          python benchmarks/r527_slot_safe_realizer.py \
            --tokenizer-model warm/nexus_r512_results/sp_unigram_4096.model \
            --warm-checkpoint warm/nexus_r512_results/R512_DEEP_LANGUAGE_3M.pt \
            --steps 4096 \
            --eval-n 2048 \
            --out nexus_r527_results \
            --threads 2
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r527_results/00_R527_RESULTS.json ]; then cat nexus_r527_results/00_R527_RESULTS.json; fi
          if [ -f nexus_r527_results/01_EXAMPLES.json ]; then sed -n '1,260p' nexus_r527_results/01_EXAMPLES.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R527_SLOT_SAFE_REALIZER
          path: nexus_r527_results/
          if-no-files-found: warn
          retention-days: 30
