name: NEXUS R5.17 PAD Clean Inference
on:
  push:
    branches: ["nexus-r517-pad-clean"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pad-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Restore R5.12 32K
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R512_DEEP_LANGUAGE
          path: warm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31336592447
      - name: Data and exact fast corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          mkdir -p data/r517
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r517/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r517/b.conllu
          cat data/r517/a.conllu data/r517/b.conllu > data/r517/train.conllu
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r517/train.conllu --out data/r517/rich
      - name: Run PAD-clean frozen-checkpoint diagnosis
        run: |
          python -m py_compile benchmarks/r517_pad_clean_inference.py
          python benchmarks/r517_pad_clean_inference.py \
            --checkpoint warm/nexus_r512_results/R512_DEEP_LANGUAGE_3M.pt \
            --tokenizer-model warm/nexus_r512_results/sp_unigram_4096.model \
            --memory-docs data/r517/rich/graph_memory_docs.jsonl \
            --heldout data/r517/rich/ru_heritage_test.txt \
            --out nexus_r517_results --threads 2
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r517_results/00_R517_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r517_results/00_R517_RESULTS.json',encoding='utf-8'));print(r['protocol']);print(r['aggregate'])
          PY
          fi
          cat nexus_r517_results/01_RAW_GENERATIONS.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R517_PAD_CLEAN
          path: nexus_r517_results/
          retention-days: 30
