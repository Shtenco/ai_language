name: NEXUS R5.25 Persistent GraphRAG
on:
  push:
    branches: ["nexus-r525-persistent-graphrag-memory"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and benchmark persistent memory
        run: python benchmarks/r525_persistent_graphrag.py --out nexus_r525_results
      - name: Evidence
        run: |
          cat nexus_r525_results/00_R525_RESULTS.json
          ls -lh nexus_r525_results/nexus_graph_memory.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R525_PERSISTENT_GRAPHRAG
          path: nexus_r525_results/
          retention-days: 30
