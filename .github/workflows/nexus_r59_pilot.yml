name: NEXUS R5.9 Pilot
on:
  push:
    branches: ["nexus-r59-pilot"]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Restore source
        run: |
          base64 -d benchmarks/r59_learned_semantic_graph.py.gz.b64 | gzip -d > benchmarks/r59_learned_semantic_graph.py
          python -m py_compile benchmarks/r59_learned_semantic_graph.py
      - name: Data
        run: |
          mkdir -p data/r59p
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r59p/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r59p/b.conllu
          cat data/r59p/a.conllu data/r59p/b.conllu > data/r59p/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r59p/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r59p/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r59p/synt.conllu','data/r59p/synt.txt'),('data/r59p/gsd.conllu','data/r59p/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r59p/train.conllu --out data/r59p/rich
      - name: Train 256-step null-shuffled-true
        run: |
          set +e
          python benchmarks/r59_learned_semantic_graph.py \
            --train-text data/r59p/rich/ru_train.txt \
            --train-docs data/r59p/rich/ru_train_docs.jsonl \
            --memory-docs data/r59p/rich/graph_memory_docs.jsonl \
            --tests data/r59p/synt.txt data/r59p/gsd.txt data/r59p/rich/ru_heritage_test.txt \
            --out nexus_r59_pilot_results \
            --modes A_NULL,S_SHUFFLED,D_TRUE --steps 256 --batch 8 --seed 20260810 --threads 2
          rc=$?
          cp data/r59p/rich/CORPUS_META.json nexus_r59_pilot_results/ 2>/dev/null || true
          cp benchmarks/r59_learned_semantic_graph.py nexus_r59_pilot_results/R59_SOURCE.py 2>/dev/null || true
          echo $rc > nexus_r59_pilot_results/TRAIN_EXIT_CODE.txt
          exit $rc
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r59_pilot_results/00_R59_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r59_pilot_results/00_R59_RESULTS.json',encoding='utf-8'))
          for m,z in r['results'].items():
              print(m,z['training'])
              print({k:round(v['bpb'],6) for k,v in z['eval'].items()})
              if z['logic_generation'] is not None:print('logic/cyber',z['logic_generation']['accuracy'],z['cyber_generation']['accuracy'])
          PY
          fi
          if [ -f nexus_r59_pilot_results/01_RAW_GENERATIONS.txt ]; then cat nexus_r59_pilot_results/01_RAW_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r59_pilot_results ]; then tar -czf NEXUS_R59_PILOT.tar.gz nexus_r59_pilot_results; sha256sum NEXUS_R59_PILOT.tar.gz > NEXUS_R59_PILOT_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R59_PILOT
          path: |
            nexus_r59_pilot_results/
            NEXUS_R59_PILOT.tar.gz
            NEXUS_R59_PILOT_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
