name: NEXUS R5.22 Typed Binding Authority
on:
  push:
    branches: ["nexus-r522-typed-binding-authority"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Verify 20k typed bindings
        run: |
          python benchmarks/r522_typed_binding_authority.py --logic-n 10000 --cyber-n 10000 --out nexus_r522_results
      - name: Evidence
        run: |
          cat nexus_r522_results/README_RU.md
          sed -n '1,40p' nexus_r522_results/01_TYPED_BINDING_EXAMPLES.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R522_TYPED_BINDING_AUTHORITY
          path: nexus_r522_results/
          retention-days: 30
