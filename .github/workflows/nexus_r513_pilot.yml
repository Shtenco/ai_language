name: NEXUS R5.13 Pilot
on:
  push:
    branches: ["nexus-r513-pilot"]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Data
        run: |
          mkdir -p data/r513p
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r513p/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r513p/b.conllu
          cat data/r513p/a.conllu data/r513p/b.conllu > data/r513p/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r513p/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r513p/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r513p/synt.conllu','data/r513p/synt.txt'),('data/r513p/gsd.conllu','data/r513p/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r513p/train.conllu --out data/r513p/rich
      - name: Train masked pilot
        run: |
          set +e
          python benchmarks/r513_masked_iterative.py \
            --train-text data/r513p/rich/ru_train.txt \
            --train-docs data/r513p/rich/ru_train_docs.jsonl \
            --memory-docs data/r513p/rich/graph_memory_docs.jsonl \
            --tests data/r513p/synt.txt data/r513p/gsd.txt data/r513p/rich/ru_heritage_test.txt \
            --out nexus_r513_pilot_results --steps 1024 --batch 8 --seed 20260810 --threads 2
          rc=$?
          cp data/r513p/rich/CORPUS_META.json nexus_r513_pilot_results/ 2>/dev/null || true
          echo $rc > nexus_r513_pilot_results/TRAIN_EXIT_CODE.txt
          exit $rc
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r513_pilot_results/00_R513_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r513_pilot_results/00_R513_RESULTS.json',encoding='utf-8'))
          print(r['training']);print({k:round(v['fullmask_bpb'],6) for k,v in r['eval'].items()});print('logic/cyber',r['logic_generation']['accuracy'],r['cyber_generation']['accuracy'])
          PY
          fi
          if [ -f nexus_r513_pilot_results/01_RAW_GENERATIONS.txt ]; then cat nexus_r513_pilot_results/01_RAW_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r513_pilot_results ]; then tar -czf NEXUS_R513_PILOT.tar.gz nexus_r513_pilot_results; sha256sum NEXUS_R513_PILOT.tar.gz > NEXUS_R513_PILOT_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R513_PILOT
          path: |
            nexus_r513_pilot_results/
            NEXUS_R513_PILOT.tar.gz
            NEXUS_R513_PILOT_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
