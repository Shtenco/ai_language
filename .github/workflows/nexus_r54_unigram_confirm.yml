name: NEXUS R5.4 Unigram 10-Seed Confirm
on:
  push:
    branches: ["nexus-r54-unigram-confirm"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          python -m pip install sentencepiece
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Download corpora
        run: |
          mkdir -p data/r54
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt -o data/r54/wiki.train.txt
          curl -fL https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/test.txt -o data/r54/wiki.test.txt
          curl -fL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o data/r54/tinyshakespeare.txt
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r54/ru_synt.train.a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r54/ru_synt.train.b.conllu
          cat data/r54/ru_synt.train.a.conllu data/r54/ru_synt.train.b.conllu > data/r54/ru_synt.train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r54/ru_synt.test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r54/ru_gsd.test.conllu
          sha256sum data/r54/* > data/r54/CORPUS_SHA256SUMS.txt
      - name: Prepare balanced train
        run: python benchmarks/prepare_r52_corpora.py --wiki-train data/r54/wiki.train.txt --synt-train data/r54/ru_synt.train.conllu --synt-test data/r54/ru_synt.test.conllu --gsd-test data/r54/ru_gsd.test.conllu --out data/r54/prepared --per-lang-bytes 5000000
      - name: Run confirmation
        run: |
          python benchmarks/r54_unigram_10seed_confirm.py --train data/r54/prepared/mixed_train.txt --tests data/r54/wiki.test.txt data/r54/tinyshakespeare.txt data/r54/prepared/ru_synt_test.txt data/r54/prepared/ru_gsd_shift.txt --out nexus_r54_results --seeds 3,7,11,17,23,29,37,47,61,73 --threads 2
          cp data/r54/CORPUS_SHA256SUMS.txt nexus_r54_results/
      - name: Archive
        run: |
          tar -czf NEXUS_R54_UNIGRAM_10SEED.tar.gz nexus_r54_results
          sha256sum NEXUS_R54_UNIGRAM_10SEED.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_R54_UNIGRAM_10SEED
          path: |
            nexus_r54_results/
            NEXUS_R54_UNIGRAM_10SEED.tar.gz
          retention-days: 30
