name: NEXUS R5.7 Nano Signal
on:
  push:
    branches: ["nexus-r57-nano"]
  workflow_dispatch:

jobs:
  nano:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Data
        run: |
          mkdir -p data/r57nano
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r57nano/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r57nano/b.conllu
          cat data/r57nano/a.conllu data/r57nano/b.conllu > data/r57nano/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r57nano/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r57nano/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r57nano/synt.conllu','data/r57nano/synt.txt'),('data/r57nano/gsd.conllu','data/r57nano/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r57nano/train.conllu --out data/r57nano/rich
      - name: Nano train and evaluate
        run: |
          python benchmarks/r57_nano.py \
            --train-text data/r57nano/rich/ru_train.txt \
            --train-docs data/r57nano/rich/ru_train_docs.jsonl \
            --memory-docs data/r57nano/rich/graph_memory_docs.jsonl \
            --tests data/r57nano/synt.txt data/r57nano/gsd.txt data/r57nano/rich/ru_heritage_test.txt \
            --out nexus_r57_nano_results --screen-seeds 11 --threads 2
          cp data/r57nano/rich/CORPUS_META.json nexus_r57_nano_results/
      - name: Show evidence
        if: always()
        run: |
          if [ -f nexus_r57_nano_results/02_SCREEN_AGGREGATE.csv ]; then cat nexus_r57_nano_results/02_SCREEN_AGGREGATE.csv; fi
          if [ -f nexus_r57_nano_results/03_RAW_RUSSIAN_GENERATIONS.txt ]; then cat nexus_r57_nano_results/03_RAW_RUSSIAN_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r57_nano_results ]; then
            tar -czf NEXUS_R57_NANO.tar.gz nexus_r57_nano_results
            sha256sum NEXUS_R57_NANO.tar.gz > NEXUS_R57_NANO_SHA256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R57_NANO
          path: |
            nexus_r57_nano_results/
            NEXUS_R57_NANO.tar.gz
            NEXUS_R57_NANO_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
