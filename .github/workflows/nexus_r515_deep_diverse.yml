name: NEXUS R5.15 Deep Diverse Russian
on:
  push:
    branches: ["nexus-r515-deep-diverse"]
  workflow_dispatch:

jobs:
  deep-diverse:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Download fixed Russian UD corpora
        run: |
          mkdir -p data/r515
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r515/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r515/b.conllu
          cat data/r515/a.conllu data/r515/b.conllu > data/r515/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r515/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r515/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r515/synt.conllu','data/r515/synt.txt'),('data/r515/gsd.conllu','data/r515/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Build document-disjoint Wikipedia-RuHeritage-SynTagRus corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_russian_corpus.py \
            --synt-train data/r515/train.conllu --out data/r515/rich \
            --wiki-train-mb 20 --wiki-memory-mb 5 --wiki-test-mb 3 \
            --heritage-train-mb 6 --heritage-test-mb 2 --synt-train-mb 4 --max-doc-kb 24
          cat data/r515/rich/CORPUS_META.json
      - name: Deep train 32768 steps on diverse corpus
        run: |
          set +e
          python benchmarks/r512_deep_language.py \
            --train-text data/r515/rich/ru_train.txt \
            --train-docs data/r515/rich/ru_train_docs.jsonl \
            --memory-docs data/r515/rich/graph_memory_docs.jsonl \
            --tests data/r515/synt.txt data/r515/gsd.txt data/r515/rich/ru_wiki_test.txt data/r515/rich/ru_heritage_test.txt \
            --out nexus_r515_results --threads 2
          rc=$?
          cp data/r515/rich/CORPUS_META.json nexus_r515_results/ 2>/dev/null || true
          cp benchmarks/r512_deep_language.py nexus_r515_results/R515_SOURCE.py 2>/dev/null || true
          echo $rc > nexus_r515_results/TRAIN_EXIT_CODE.txt
          exit $rc
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r515_results/00_R512_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r515_results/00_R512_RESULTS.json',encoding='utf-8'))
          print('training',r['training'])
          print('bpb',{k:round(v['bpb'],6) for k,v in r['eval'].items()})
          print('logic/cyber',r['logic_generation']['accuracy'],r['cyber_generation']['accuracy'])
          PY
          fi
          if [ -f nexus_r515_results/01_RAW_GENERATIONS.txt ]; then cat nexus_r515_results/01_RAW_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r515_results ]; then tar -czf NEXUS_R515_DEEP_DIVERSE.tar.gz nexus_r515_results; sha256sum NEXUS_R515_DEEP_DIVERSE.tar.gz > NEXUS_R515_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R515_DEEP_DIVERSE
          path: |
            nexus_r515_results/
            NEXUS_R515_DEEP_DIVERSE.tar.gz
            NEXUS_R515_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
