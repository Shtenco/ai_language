name: NEXUS R5.12 Deep Language 8K
on:
  push:
    branches: ["nexus-r512-8k-pilot"]
  workflow_dispatch:

jobs:
  deep8k:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Data
        run: |
          mkdir -p data/r512p
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r512p/a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r512p/b.conllu
          cat data/r512p/a.conllu data/r512p/b.conllu > data/r512p/train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r512p/synt.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r512p/gsd.conllu
          python - <<'PY'
          from pathlib import Path
          for src,dst in [('data/r512p/synt.conllu','data/r512p/synt.txt'),('data/r512p/gsd.conllu','data/r512p/gsd.txt')]:
              out=[x[9:].strip() for x in Path(src).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
              Path(dst).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Corpus
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
        run: |
          python benchmarks/prepare_r57_fast_corpus.py --synt-train data/r512p/train.conllu --out data/r512p/rich
      - name: Train 8192-step checkpoint
        run: |
          set +e
          python benchmarks/r512_8k_pilot.py \
            --train-text data/r512p/rich/ru_train.txt \
            --train-docs data/r512p/rich/ru_train_docs.jsonl \
            --memory-docs data/r512p/rich/graph_memory_docs.jsonl \
            --tests data/r512p/synt.txt data/r512p/gsd.txt data/r512p/rich/ru_heritage_test.txt \
            --out nexus_r512_8k_results --threads 2
          rc=$?
          cp data/r512p/rich/CORPUS_META.json nexus_r512_8k_results/ 2>/dev/null || true
          echo $rc > nexus_r512_8k_results/TRAIN_EXIT_CODE.txt
          exit $rc
      - name: Evidence
        if: always()
        run: |
          if [ -f nexus_r512_8k_results/00_R512_RESULTS.json ]; then python - <<'PY'
          import json
          r=json.load(open('nexus_r512_8k_results/00_R512_RESULTS.json',encoding='utf-8'))
          print(r['training']);print({k:round(v['bpb'],6) for k,v in r['eval'].items()});print('logic/cyber',r['logic_generation']['accuracy'],r['cyber_generation']['accuracy'])
          PY
          fi
          if [ -f nexus_r512_8k_results/01_RAW_GENERATIONS.txt ]; then cat nexus_r512_8k_results/01_RAW_GENERATIONS.txt; fi
      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r512_8k_results ]; then tar -czf NEXUS_R512_8K.tar.gz nexus_r512_8k_results; sha256sum NEXUS_R512_8K.tar.gz > NEXUS_R512_8K_SHA256.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R512_8K
          path: |
            nexus_r512_8k_results/
            NEXUS_R512_8K.tar.gz
            NEXUS_R512_8K_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
