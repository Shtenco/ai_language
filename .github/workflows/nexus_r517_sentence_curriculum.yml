name: NEXUS R5.17 Sentence Curriculum
on:
  push:
    branches: ["nexus-r517-sentence-curriculum"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece datasets
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch
          print('torch', torch.__version__)
          PY

      - name: Download frozen R5.12 32K language organ
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R512_DEEP_LANGUAGE
          path: warm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31336592447

      - name: Download fixed Russian UD corpora
        run: |
          mkdir -p data/r517
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r517/ru_synt.train.a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r517/ru_synt.train.b.conllu
          cat data/r517/ru_synt.train.a.conllu data/r517/ru_synt.train.b.conllu > data/r517/ru_synt.train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r517/ru_synt.test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r517/ru_gsd.test.conllu

      - name: Extract held-out UD text
        run: |
          python - <<'PY'
          from pathlib import Path
          def convert(src, dst):
              out=[]
              for line in Path(src).read_text(encoding='utf-8').splitlines():
                  if line.startswith('# text = '):
                      t=line[9:].strip()
                      if t: out.append(t)
              Path(dst).write_text('\n'.join(out)+'\n', encoding='utf-8')
          convert('data/r517/ru_synt.test.conllu','data/r517/ru_synt_test.txt')
          convert('data/r517/ru_gsd.test.conllu','data/r517/ru_gsd_test.txt')
          PY

      - name: Build diverse document-disjoint corpus
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python benchmarks/prepare_r57_russian_corpus.py \
            --synt-train data/r517/ru_synt.train.conllu \
            --out data/r517/rich \
            --wiki-train-mb 20 \
            --wiki-memory-mb 5 \
            --wiki-test-mb 3 \
            --heritage-train-mb 6 \
            --heritage-test-mb 2 \
            --synt-train-mb 4 \
            --max-doc-kb 24
          cat data/r517/rich/CORPUS_META.json

      - name: Train sentence-aligned 5.404M semantic organ
        run: |
          TESTS=(
            data/r517/ru_synt_test.txt
            data/r517/ru_gsd_test.txt
            data/r517/rich/ru_wiki_test.txt
            data/r517/rich/ru_heritage_test.txt
          )
          python benchmarks/r517_sentence_curriculum.py \
            --train-docs data/r517/rich/ru_train_docs.jsonl \
            --memory-docs data/r517/rich/graph_memory_docs.jsonl \
            --tests "${TESTS[@]}" \
            --tokenizer-model warm/nexus_r512_results/sp_unigram_4096.model \
            --warm-checkpoint warm/nexus_r512_results/R512_DEEP_LANGUAGE_3M.pt \
            --steps 8192 \
            --out nexus_r517_results \
            --threads 2
          cp data/r517/rich/CORPUS_META.json nexus_r517_results/

      - name: Print evidence
        if: always()
        run: |
          if [ -f nexus_r517_results/01_RAW_GENERATIONS.txt ]; then sed -n '1,360p' nexus_r517_results/01_RAW_GENERATIONS.txt; fi

      - name: Archive
        if: always()
        run: |
          if [ -d nexus_r517_results ]; then
            tar -czf NEXUS_R517_SENTENCE_CURRICULUM.tar.gz nexus_r517_results
            sha256sum NEXUS_R517_SENTENCE_CURRICULUM.tar.gz | tee NEXUS_R517_SHA256.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R517_SENTENCE_CURRICULUM
          path: |
            nexus_r517_results/
            NEXUS_R517_SENTENCE_CURRICULUM.tar.gz
            NEXUS_R517_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
