name: NEXUS R5.24 Capacity Pilot
on:
  push:
    branches: ["nexus-r524-capacity-pilot"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        config: [3M, 8M, 11M]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install sentencepiece
          python - <<'PY' || python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          import torch; print(torch.__version__)
          PY
      - name: Restore fixed Unigram4096 tokenizer
        uses: actions/download-artifact@v4
        with:
          name: NEXUS_R512_DEEP_LANGUAGE
          path: warm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shtenco/ai_language
          run-id: 31336592447
      - name: Build exact matched direct-UD corpus
        run: |
          mkdir -p data/r524p
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-a.conllu -o data/r524p/syn-a.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-train-b.conllu -o data/r524p/syn-b.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-SynTagRus/master/ru_syntagrus-ud-test.conllu -o data/r524p/syn-test.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-train.conllu -o data/r524p/gsd-train.conllu
          curl -fL https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-GSD/master/ru_gsd-ud-test.conllu -o data/r524p/gsd-test.conllu
          python - <<'PY'
          import json,random
          from pathlib import Path
          def texts(p): return [x[9:].strip() for x in Path(p).read_text(encoding='utf-8').splitlines() if x.startswith('# text = ') and x[9:].strip()]
          sources=[('SynTagRus',texts('data/r524p/syn-a.conllu')+texts('data/r524p/syn-b.conllu')),('GSD',texts('data/r524p/gsd-train.conllu'))]
          docs=[]
          for src,arr in sources:
              for i in range(0,len(arr),8):
                  text=' '.join(arr[i:i+8]).strip()
                  if len(text)>=240: docs.append({'id':f'{src}-{i//8:06d}','source':src,'text':text})
          random.Random(20260810).shuffle(docs)
          with open('data/r524p/train_docs.jsonl','w',encoding='utf-8') as f:
              for d in docs:f.write(json.dumps(d,ensure_ascii=False)+'\n')
          Path('data/r524p/synt.txt').write_text('\n'.join(texts('data/r524p/syn-test.conllu'))+'\n',encoding='utf-8')
          Path('data/r524p/gsd.txt').write_text('\n'.join(texts('data/r524p/gsd-test.conllu'))+'\n',encoding='utf-8')
          print('docs',len(docs),'bytes',sum(len(d['text'].encode()) for d in docs))
          PY
      - name: Train 1024-step matched clean cortex
        run: |
          python -m py_compile benchmarks/r524_capacity_sweep.py
          OUT=nexus_r524p_${{ matrix.config }}
          python benchmarks/r524_capacity_sweep.py \
            --config ${{ matrix.config }} \
            --tokenizer-model warm/nexus_r512_results/sp_unigram_4096.model \
            --train-docs data/r524p/train_docs.jsonl \
            --tests data/r524p/synt.txt data/r524p/gsd.txt \
            --out "$OUT" --steps 1024 --batch 8 --threads 2 --lr 0.0005
      - name: Evidence
        if: always()
        run: |
          OUT=nexus_r524p_${{ matrix.config }}
          if [ -f "$OUT/00_R524_RESULTS.json" ]; then python - <<PY
          import json
          r=json.load(open('$OUT/00_R524_RESULTS.json',encoding='utf-8'));print(r['protocol']);print(r['training'])
          for s,v in r['eval'].items():print(s,{k:round(x['bpb'],6) for k,x in v.items()})
          PY
          fi
          cat "$OUT/01_RAW_GENERATIONS.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS_R524P_${{ matrix.config }}
          path: nexus_r524p_${{ matrix.config }}/
          retention-days: 30
